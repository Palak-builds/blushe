apiVersion: apps/v1
kind: Deployment
metadata:
  name: blushe-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: blushe-frontend
  template:
    metadata:
      labels:
        app: blushe-frontend
    spec:
      containers:
        - name: blushe-frontend
          image: palaksh16/blushe-frontend:v2
          ports:
            - containerPort: 80
